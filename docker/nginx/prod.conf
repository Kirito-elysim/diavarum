# Production : /api → Symfony (php-fpm), tout le reste → front React compilé.
server {
    listen 80;
    server_name _;
    root /app/public;
    client_max_body_size 50m;
    server_tokens off;

    # Liste blanche IP et proxys de confiance, générés au démarrage (docker/nginx/40-ip-allowlist.sh)
    include /etc/nginx/allowlist.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /bundles/ {
        try_files $uri =404;
    }

    location ~ ^/api(/|$) {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        fastcgi_read_timeout 300;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    # Fichiers du build Vite : noms hashés, cache long.
    # (pas d'add_header ici : il annulerait les en-têtes de sécurité du server)
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        try_files $uri =404;
    }

    # Application React (SPA) : toute autre URL renvoie index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        expires -1;
    }
}
