# Production : images autonomes (code embarqué), secrets obligatoires.
# docker compose -f compose.yaml -f compose.prod.yaml up -d --build

services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: php-prod
    image: diaverum-php:prod
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET est obligatoire}
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}@db:5432/${POSTGRES_DB:?}?serverVersion=${POSTGRES_VERSION:-16}&charset=utf8
      MAILER_DSN: ${MAILER_DSN:?MAILER_DSN est obligatoire}
      MAILER_FROM: ${MAILER_FROM:?MAILER_FROM est obligatoire}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?JWT_PASSPHRASE est obligatoire}
      # Jeton du prestataire pour l'intégration des contenus (vide = API d'intégration désactivée)
      CONTENT_API_TOKEN: ${CONTENT_API_TOKEN:-}
    volumes:
      - jwt_keys:/app/config/jwt

  worker:
    # Même image que « php » (construite par ce service) : jamais téléchargée
    image: diaverum-php:prod
    pull_policy: never
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?}
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}?serverVersion=${POSTGRES_VERSION:-16}&charset=utf8
      MAILER_DSN: ${MAILER_DSN:?}
      MAILER_FROM: ${MAILER_FROM:?}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?}

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: nginx-prod
    image: diaverum-nginx:prod
    environment:
      ALLOWED_IPS: ${ALLOWED_IPS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}

  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}

volumes:
  jwt_keys:
